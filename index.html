<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Household Expense Tracker</title>
    <!-- Tailwind CSS for modern mobile-friendly UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS & PDF.js for statements parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Tesseract.js for Receipt OCR scanning -->
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b pb-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Expense Tracker Dashboard</h1>
                <p class="text-sm text-slate-500">Manage, track, and analyze your household finances seamlessly.</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <select id="month-filter" class="w-full sm:w-auto bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">All Months</option>
                </select>
            </div>
        </header>

        <!-- Metric Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Expenses</p>
                <p id="metric-total" class="text-2xl font-bold text-slate-900 mt-1">¥0</p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Fixed Expenses</p>
                <p id="metric-fixed" class="text-2xl font-bold text-indigo-600 mt-1">¥0</p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Variable Expenses</p>
                <p id="metric-variable" class="text-2xl font-bold text-emerald-600 mt-1">¥0</p>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Investments / Savings</p>
                <p id="metric-savings" class="text-2xl font-bold text-sky-600 mt-1">¥0</p>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Form & Import Section -->
            <div class="space-y-6">
                <!-- Add Expense Form -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Add New Transaction</h2>
                    <form id="expense-form" class="space-y-4" onsubmit="handleAddExpense(event)">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Date</label>
                            <input type="date" id="expense-date" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Description / Item</label>
                            <input type="text" id="expense-desc" placeholder="e.g., Grocery shopping" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Amount (¥)</label>
                            <input type="number" id="expense-amount" placeholder="0" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Category</label>
                            <select id="expense-category" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="Food">Food & Groceries</option>
                                <option value="Utilities">Utilities & Housing</option>
                                <option value="Transport">Transport</option>
                                <option value="Education">Education / Children</option>
                                <option value="Investment">Investment & Savings</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm shadow transition-colors">
                            Add Transaction
                        </button>
                    </form>
                </div>

                <!-- Receipt OCR / Import Options -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Import & OCR Scanner</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Upload Receipt (OCR)</label>
                            <input type="file" id="receipt-file" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700 mb-1">Import CSV / PDF Statement</label>
                            <input type="file" id="statement-file" accept=".csv, .pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Transactions & Charts Section -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Transaction Table Container -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-slate-900">Transaction History</h2>
                        <span id="transaction-count" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">0 items</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                    <th class="py-3 px-6 font-medium">Date</th>
                                    <th class="py-3 px-6 font-medium">Description</th>
                                    <th class="py-3 px-6 font-medium">Category</th>
                                    <th class="py-3 px-6 font-right font-medium text-right">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-table-body" class="divide-y divide-slate-200 text-sm text-slate-700">
                                <!-- Dynamically populated rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Global state storage
        let transactions = [];
        const FIXED_ITEMS = [
            { date: '01', desc: 'Housing Loan / Rent', amount: 85000, category: 'Utilities', isFixed: true },
            { date: '25', desc: 'Investment / Savings Fund', amount: 30000, category: 'Investment', isFixed: true }
        ];

        // Hardened Date Sanitizer Function (Consolidated)
        function sanitizeDate(input) {
            if (!input) return new Date().toISOString().split('T')[0];
            let str = String(input).trim();
            let parsed = new Date(str);
            if (!isNaN(parsed.getTime())) {
                return parsed.toISOString().split('T')[0];
            }
            return new Date().toISOString().split('T')[0];
        }

        // Consolidated populateMonthFilter Function
        function populateMonthFilter() {
            const filterSelect = document.getElementById('month-filter');
            const currentSelection = filterSelect.value;
            
            // Extract unique months from transactions
            const months = [...new Set(transactions.map(t => t.date ? t.date.substring(0, 7) : ''))].filter(Boolean);
            months.sort().reverse();

            // Reset options keeping default
            filterSelect.innerHTML = '<option value="all">All Months</option>';
            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                filterSelect.appendChild(opt);
            });

            if (months.includes(currentSelection)) {
                filterSelect.value = currentSelection;
            }
        }

        function handleAddExpense(event) {
            event.preventDefault();
            const date = sanitizeDate(document.getElementById('expense-date').value);
            const desc = document.getElementById('expense-desc').value;
            const amount = parseFloat(document.getElementById('expense-amount').value) || 0;
            const category = document.getElementById('expense-category').value;

            const newTx = { date, desc, amount, category, isFixed: false };
            transactions.push(newTx);
            
            // Reset Form and Refresh UI
            document.getElementById('expense-form').reset();
            document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
            
            refreshDashboard();
        }

        function refreshDashboard() {
            populateMonthFilter();
            const selectedMonth = document.getElementById('month-filter').value;
            
            let filtered = transactions;
            if (selectedMonth !== 'all') {
                filtered = transactions.filter(t => t.date && t.date.startsWith(selectedMonth));
            }

            // Render table rows
            const tbody = document.getElementById('transaction-table-body');
            tbody.innerHTML = '';

            let totalSum = 0;
            let fixedSum = 0;
            let varSum = 0;
            let saveSum = 0;

            filtered.forEach(t => {
                totalSum += t.amount;
                if (t.isFixed) fixedSum += t.amount;
                else if (t.category === 'Investment') saveSum += t.amount;
                else varSum += t.amount;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-6 whitespace-nowrap">${t.date}</td>
                    <td class="py-3 px-6">${t.desc} ${t.isFixed ? '<span class="ml-2 text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded">Fixed</span>' : ''}</td>
                    <td class="py-3 px-6 whitespace-nowrap"><span class="px-2 py-1 text-xs rounded-full bg-slate-100 text-slate-700">${t.category}</span></td>
                    <td class="py-3 px-6 text-right font-medium whitespace-nowrap">¥${t.amount.toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });

            // Update metrics display
            document.getElementById('metric-total').textContent = `¥${totalSum.toLocaleString()}`;
            document.getElementById('metric-fixed').textContent = `¥${fixedSum.toLocaleString()}`;
            document.getElementById('metric-variable').textContent = `¥${varSum.toLocaleString()}`;
            document.getElementById('metric-savings').textContent = `¥${saveSum.toLocaleString()}`;
            document.getElementById('transaction-count').textContent = `${filtered.length} items`;
        }

        // Initialize default date on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
            refreshDashboard();
        });
    </script>
</body>
</html>
