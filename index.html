<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMBC Bank Statement Parser</title>
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    .upload-box {
      border: 2px dashed #006633;
      background-color: #f4fbf7;
      padding: 30px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .upload-box:hover {
      background-color: #e8f7ef;
    }
    #fileInput {
      display: none;
    }
    .privacy-badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      text-align: left;
    }
    th {
      background-color: #f8fafc;
      font-weight: 600;
    }
    .amount-deposit {
      color: #16a34a;
      font-weight: 600;
    }
    .amount-withdrawal {
      color: #dc2626;
      font-weight: 600;
    }
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .stat-card {
      flex: 1;
      background: #f8fafc;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <h2>SMBC Bank Statement Parser</h2>
  <span class="privacy-badge">🔒 Privacy Guaranteed: Local In-Browser Processing Only</span>

  <div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <p><strong>Click to upload SMBC PDF</strong> or drag and drop</p>
    <small>Personal details (names, account numbers) are automatically filtered out locally.</small>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <div id="statsContainer" class="stats" style="display: none;">
    <div class="stat-card">
      <small>Total Deposits</small>
      <div id="totalDeposits" class="amount-deposit">¥0</div>
    </div>
    <div class="stat-card">
      <small>Total Withdrawals</small>
      <div id="totalWithdrawals" class="amount-withdrawal">¥0</div>
    </div>
    <div class="stat-card">
      <small>Transactions Parsed</small>
      <div id="totalCount">0</div>
    </div>
  </div>

  <table id="transactionTable" style="display: none;">
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Type</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody id="transactionBody"></tbody>
  </table>

  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.getElementById('fileInput').addEventListener('change', handleFileUpload);

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      
      let rawLines = [];

      // Extract raw text lines across all pages
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const pageLines = content.items
          .map(item => item.str.trim())
          .filter(str => str.length > 0);
        
        rawLines.push(...pageLines);
      }

      const transactions = parseSmbcTransactions(rawLines);
      renderTable(transactions);
    }

    function parseSmbcTransactions(lines) {
      const transactions = [];
      
      const dateRegex = /(\d{1,2}月\d{1,2}日)/;
      const amountRegex = /([\d,]+)\s*円\s*([+-]?)/;
      const yearRegex = /^\d{4}年\d{1,2}月$/;

      // PII & Header blacklist words to exclude non-transaction metadata
      const blacklist = [
        "明細照会", "SMBC", "照会口座", "川崎支店", "残高別普通", 
        "入金合計", "出金", "お取扱内容", "日付", "お引き出し", 
        "お預け入れ", "残高", "対象期間", "印刷されたタイミング", 
        "三井住友銀行", "さま", "https://", "1/3", "2/3", "3/3"
      ];

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].replace(/^\|\s*/, '').trim();

        // Skip headers and PII metadata lines
        if (blacklist.some(keyword => line.includes(keyword))) continue;

        // Detect transaction date
        const dateMatch = line.match(dateRegex);
        if (dateMatch) {
          const dateStr = dateMatch[1];
          let inlineDesc = line.replace(dateStr, '').replace(/^\|\s*/, '').trim();

          let description = inlineDesc;
          let amount = null;
          let type = "withdrawal";

          // Look ahead to capture multi-line descriptions and amounts
          for (let j = i + 1; j < Math.min(i + 6, lines.length); j++) {
            let nextLine = lines[j].replace(/^\|\s*/, '').trim();

            if (blacklist.some(keyword => nextLine.includes(keyword))) continue;

            const amountMatch = nextLine.match(amountRegex);
            if (amountMatch) {
              amount = parseInt(amountMatch[1].replace(/,/g, ''), 10);
              const sign = amountMatch[2];

              if (sign === '+' || nextLine.includes('+')) {
                type = 'deposit';
              } else {
                type = 'withdrawal';
              }
              break;
            } else if (!dateRegex.test(nextLine) && !yearRegex.test(nextLine)) {
              if (!description) {
                description = nextLine;
              } else if (!description.includes(nextLine)) {
                description += " " + nextLine;
              }
            }
          }

          if (amount !== null) {
            transactions.push({
              date: dateStr,
              description: description || "Unknown",
              type,
              amount
            });
          }
        }
      }

      return transactions;
    }

    function renderTable(transactions) {
      const tbody = document.getElementById('transactionBody');
      tbody.innerHTML = '';

      let depositsSum = 0;
      let withdrawalsSum = 0;

      transactions.forEach(tx => {
        const row = document.createElement('tr');
        
        if (tx.type === 'deposit') {
          depositsSum += tx.amount;
        } else {
          withdrawalsSum += tx.amount;
        }

        row.innerHTML = `
          <td>${tx.date}</td>
          <td>${escapeHtml(tx.description)}</td>
          <td><span class="${tx.type === 'deposit' ? 'amount-deposit' : 'amount-withdrawal'}">${tx.type.toUpperCase()}</span></td>
          <td class="${tx.type === 'deposit' ? 'amount-deposit' : 'amount-withdrawal'}">
            ${tx.type === 'deposit' ? '+' : '-'}¥${tx.amount.toLocaleString()}
          </td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('totalDeposits').textContent = `¥${depositsSum.toLocaleString()}`;
      document.getElementById('totalWithdrawals').textContent = `¥${withdrawalsSum.toLocaleString()}`;
      document.getElementById('totalCount').textContent = transactions.length;

      document.getElementById('statsContainer').style.display = 'flex';
      document.getElementById('transactionTable').style.display = 'table';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
