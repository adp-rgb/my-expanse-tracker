<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker & Statement Parser</title>
    <!-- PDF.js Library for reading PDF statements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; }
        .file-input-section {
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 6px;
            text-align: center;
            background-color: #fafafa;
            margin-bottom: 20px;
        }
        .btn-clear {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-clear:hover { background-color: #c82333; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #f1f3f5; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .summary-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            flex: 1;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
        }
        .card h3 { margin: 0 0 5px 0; font-size: 14px; color: #6c757d; }
        .card p { margin: 0; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Expense Tracker</h1>
    
    <div class="file-input-section">
        <label for="fileUpload" style="font-weight: bold; cursor: pointer;">
            Upload Statement Files (CSV or PDF):
        </label><br><br>
        <input type="file" id="fileUpload" multiple accept=".csv, .pdf" onchange="handleBatchUpload(event)">
        <br><br>
        <button class="btn-clear" onclick="resetAllData()">Clear All Loaded Data</button>
    </div>

    <div class="summary-box">
        <div class="card">
            <h3>Total Records</h3>
            <p id="totalRecords">0</p>
        </div>
        <div class="card">
            <h3>Total Amount</h3>
            <p id="totalAmount">¥0</p>
        </div>
    </div>

    <h2>Transactions</h2>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Source</th>
                <th>Amount (JPY)</th>
            </tr>
        </thead>
        <tbody id="expenseTableBody">
            <tr>
                <td colspan="5" style="text-align:center; color:#888;">No data loaded yet. Upload files above.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let expenses = [];
    let processedFiles = new Set();

    async function handleBatchUpload(event) {
        const files = Array.from(event.target.files);
        if (!files.length) return;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            
            // Allow force re-reading even if filename was uploaded before
            if (file.name.endsWith('.csv')) {
                await processCSVFile(file);
                processedFiles.add(file.name);
            } else if (file.name.endsWith('.pdf')) {
                await processPDFFile(file);
                processedFiles.add(file.name);
            }
        }
        
        // Reset file input value so selecting the same file again triggers onchange
        event.target.value = '';
        consolidateAndDeduplicateData();
    }

    async function processCSVFile(file) {
        const text = await file.text();
        const lines = text.split(/\r?\n/);

        for (let line of lines) {
            const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length < 3) continue;

            let rawDate = cols[0];
            let desc = cols[1];
            let amount = parseFloat(cols[2].replace(/,/g, ''));

            if (!isNaN(amount) && rawDate) {
                let cleanDate = sanitizeDate(rawDate);
                if (cleanDate) {
                    expenses.push({
                        date: cleanDate,
                        description: desc,
                        category: 'CSV Import',
                        source: file.name,
                        amount: amount
                    });
                }
            }
        }
    }

    async function processPDFFile(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ");
            fullText += pageText + "\n";
        }

        // Regex for SMBC format statements: YY/MM/DD Description Amount
        const regex = /(\d{2}\/\d{2}\/\d{2})\s+([^\d]+?)\s+([\d,]+)/g;
        let match;

        while ((match = regex.exec(fullText)) !== null) {
            let rawDate = match[1]; 
            let desc = match[2].trim();
            let amount = parseFloat(match[3].replace(/,/g, ''));

            let parts = rawDate.split('/');
            let fullYear = parseInt(parts[0], 10) + 2000;
            let cleanDate = `${fullYear}-${parts[1]}-${parts[2]}`;

            if (cleanDate && !isNaN(amount)) {
                expenses.push({
                    date: cleanDate,
                    description: desc,
                    category: 'Credit Card',
                    source: file.name,
                    amount: amount
                });
            }
        }
    }

    function sanitizeDate(dateStr) {
        let parts = dateStr.split(/[\/\-]/);
        if (parts.length === 3) {
            let year = parts[0];
            if (year.length === 2) year = '20' + year;
            let month = parts[1].padStart(2, '0');
            let day = parts[2].padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        return null;
    }

    function consolidateAndDeduplicateData() {
        const uniqueMap = new Map();
        
        for (let exp of expenses) {
            // Deduplicate including source filename & index to prevent identical valid charges from being omitted
            const key = `${exp.source}_${exp.date}_${exp.description}_${exp.amount}`;
            if (!uniqueMap.has(key)) {
                uniqueMap.set(key, exp);
            }
        }

        expenses = Array.from(uniqueMap.values());
        expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

        renderUI();
    }

    function resetAllData() {
        expenses = [];
        processedFiles.clear();
        document.getElementById('fileUpload').value = '';
        renderUI();
    }

    function renderUI() {
        const tbody = document.getElementById('expenseTableBody');
        tbody.innerHTML = '';

        if (expenses.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">No valid transaction records found.</td></tr>';
            document.getElementById('totalRecords').innerText = '0';
            document.getElementById('totalAmount').innerText = '¥0';
            return;
        }

        let total = 0;
        expenses.forEach(exp => {
            total += exp.amount;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${exp.date}</td>
                <td>${exp.description}</td>
                <td>${exp.category}</td>
                <td>${exp.source}</td>
                <td>¥${exp.amount.toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('totalRecords').innerText = expenses.length;
        document.getElementById('totalAmount').innerText = `¥${total.toLocaleString()}`;
    }
</script>

</body>
</html>
